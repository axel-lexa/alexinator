[project]
name = "alexinator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
app = [
    "matplotlib",
    "notebook",
    "openai>=1.0",
    "pandas",
    "pillow",
    "pytest",
    "pyyaml",
    "ruff",
    "streamlit>=1.67",
]
tokenizer = ["datasets", "pyyaml", "tokenizers"]

[tool.uv]
default-groups = ["app"]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py310"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle (erreurs)
    "W",  # pycodestyle (avertissements)
    "F",  # pyflakes : imports et variables inutilisés, noms non définis
    "I",  # tri des imports
    "B",  # bugbear : pièges courants
    "UP", # pyupgrade : syntaxe Python moderne
]

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E402"]
